<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deva SHIELD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background: radial-gradient(circle at top, #1a1a4a, #0a0a1a 80%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:#151525;width:100%;max-width:360px;border-radius:28px;padding:28px 22px;border:2px solid #00ff88;box-shadow:0 0 30px #00ff8844;text-align:center}
.logo{width:72px;height:72px;background:linear-gradient(135deg,#ffcc00,#ff9900);border-radius:20px;display:flex;justify-content:center;align-items:center;margin:0 auto 14px;font-size:38px;font-weight:900;color:#1a1a1a;box-shadow:0 0 30px rgba(255,204,0,0.5)}
h1{font-size:22px;color:white;font-weight:800}
h1 span{color:#ffcc00}
.sub{color:#8a8ab0;letter-spacing:2px;font-size:11px;margin:6px 0 18px}
.input-box{background:#0f0f1e;border:1.5px solid #3a3a5a;border-radius:14px;padding:14px;width:100%;color:white;font-size:16px;outline:none;text-align:center}
.bar{width:100%;height:14px;background:#2a2a3e;border-radius:20px;margin:18px 0 12px;overflow:hidden}
.fill{height:100%;width:0%;border-radius:20px;transition:0.5s}
.result{text-align:center;font-weight:800;font-size:16px}
.crack{color:#aaa;text-align:center;font-size:13px;margin:6px 0 12px}
.list{text-align:left;margin-top:10px}
.item{font-size:14px;margin:4px 0;transition:0.3s}
.ok{color:#00e676} .no{color:#666}
.show-btn{margin-top:16px;background:#2a2a3e;color:white;border:none;padding:8px 22px;border-radius:20px;cursor:pointer}
.footer{margin-top:18px;color:#6a6a8a;font-size:11px}
.footer span{color:#ffcc00}
</style>
</head>
<body>
<div class="card">
<div class="logo">D</div>
<h1>Deva <span>SHIELD</span> 🛡️</h1>
<div class="sub">PASSWORD STRENGTH CHECKER</div>

<input type="password" id="pass" class="input-box" placeholder="Password likho..." oninput="check()">

<div class="bar"><div id="fill" class="fill"></div></div>
<div id="res" class="result"></div>
<div id="crack" class="crack"></div>

<div class="list" id="list">
<div id="c1" class="item no">❌ 8+ Characters</div>
<div id="c2" class="item no">❌ Uppercase (A-Z)</div>
<div id="c3" class="item no">❌ Lowercase (a-z)</div>
<div id="c4" class="item no">❌ Number (0-9)</div>
<div id="c5" class="item no">❌ Symbol (@#$)</div>
</div>

<button class="show-btn" onclick="toggle()">👁️ Show</button>

<div class="footer">Made with ❤️ in <span>Rajasthan</span> by Deva Ram</div>
</div>

<script>
let show=false;
function toggle(){
 show=!show;
 document.getElementById("pass").type= show ? "text" : "password";
}
function check(){
let p=document.getElementById("pass").value;
let fill=document.getElementById("fill"), res=document.getElementById("res"), cr=document.getElementById("crack");
let checks = [
 p.length>=8,
 /[A-Z]/.test(p),
 /[a-z]/.test(p),
 /[0-9]/.test(p),
 /[^A-Za-z0-9]/.test(p)
];
for(let i=0;i<5;i++){
 let el=document.getElementById("c"+(i+1));
 if(checks[i]){ el.className="item ok"; el.innerHTML="✅ "+el.innerHTML.slice(2); }
 else{ el.className="item no"; el.innerHTML="❌ "+el.innerHTML.slice(2); }
}
// Fix text after slice
document.getElementById("c1").innerHTML=(checks[0]?"✅ ":"❌ ")+"8+ Characters";
document.getElementById("c2").innerHTML=(checks[1]?"✅ ":"❌ ")+"Uppercase (A-Z)";
document.getElementById("c3").innerHTML=(checks[2]?"✅ ":"❌ ")+"Lowercase (a-z)";
document.getElementById("c4").innerHTML=(checks[3]?"✅ ":"❌ ")+"Number (0-9)";
document.getElementById("c5").innerHTML=(checks[4]?"✅ ":"❌ ")+"Symbol (@#$)";

let score=checks.filter(Boolean).length;
let pct=(score/5)*100;
fill.style.width=pct+"%";

if(p==""){fill.style.width="0%"; res.innerHTML=""; cr.innerHTML=""; return;}

if(score<=2){fill.style.background="#ff4444"; res.innerHTML="❌ Weak"; res.style.color="#ff4444"; cr.innerHTML="⏱️ Crack: Seconds"}
else if(score==3){fill.style.background="orange"; res.innerHTML="⚠️ Medium"; res.style.color="orange"; cr.innerHTML="⏱️ Crack: Days"}
else if(score==4){fill.style.background="#ffcc00"; res.innerHTML="🟡 Good"; res.style.color="#ffcc00"; cr.innerHTML="⏱️ Crack: Years"}
else{fill.style.background="#00e676"; res.innerHTML="✅ Strong / Uncrackable"; res.style.color="#00e676"; cr.innerHTML="⏱️ Crack Time: Centuries! 🔥"}
}
</script>
</body>
</html>
