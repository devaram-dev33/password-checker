<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deva SHIELD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background: radial-gradient(circle at top, #1a1a4a, #0a0a1a 80%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:#151525;width:100%;max-width:360px;border-radius:28px;padding:24px 20px;border:2px solid #00ff88;box-shadow:0 0 30px #00ff8844;text-align:center}
.logo{width:68px;height:68px;background:linear-gradient(135deg,#ffcc00,#ff9900);border-radius:18px;display:flex;justify-content:center;align-items:center;margin:0 auto 12px;font-size:36px;font-weight:900;color:#1a1a1a;box-shadow:0 0 25px rgba(255,204,0,0.5)}
h1{font-size:22px;color:white} h1 span{color:#ffcc00;font-weight:800}
.sub{color:#8a8ab0;letter-spacing:2px;font-size:10px;margin:6px 0 16px}
.input-wrap{position:relative}
.input-box{background:#0f0f1e;border:1.5px solid #3a3a5a;border-radius:14px;padding:14px 45px 14px 14px;width:100%;color:white;font-size:16px;outline:none}
.icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.bar{width:100%;height:12px;background:#2a2a3e;border-radius:20px;margin:16px 0 10px;overflow:hidden}
.fill{height:100%;width:0%;border-radius:20px;transition:0.4s}
.result{font-weight:800;font-size:16px}
.crack{color:#aaa;font-size:12px;margin:4px 0 10px}
.list{text-align:left;margin-top:8px;background:#0f0f1e;border-radius:12px;padding:10px 12px}
.item{font-size:13px;margin:3px 0}
.ok{color:#00e676}.no{color:#ff4444}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.gen{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#111}
.copy{background:#2a2a4a;color:white}
.footer{margin-top:14px;color:#6a6a8a;font-size:11px}.footer span{color:#ffcc00}
</style>
</head>
<body>
<div class="card">
<div class="logo">D</div>
<h1>Deva <span>SHIELD</span> 🛡️</h1>
<div class="sub">PASSWORD STRENGTH CHECKER</div>

<div class="input-wrap">
<input type="password" id="pass" class="input-box" placeholder="Password likho..." oninput="check()">
<span class="icon" onclick="toggle()">👁️</span>
</div>

<div class="bar"><div id="fill" class="fill"></div></div>
<div id="res" class="result"></div>
<div id="crack" class="crack"></div>

<div class="list">
<div id="c1" class="item no">❌ 8+ Characters</div>
<div id="c2" class="item no">❌ Uppercase (A-Z)</div>
<div id="c3" class="item no">❌ Lowercase (a-z)</div>
<div id="c4" class="item no">❌ Number (0-9)</div>
<div id="c5" class="item no">❌ Symbol (@#$)</div>
</div>

<div class="btns">
<button class="btn gen" onclick="generate()">✨ Generate</button>
<button class="btn copy" onclick="copyPass()">📋 Copy</button>
</div>

<div class="footer">Made with ❤️ in <span>Rajasthan</span> by Deva Ram</div>
</div>

<script>
let show=false;
function toggle(){
 show=!show;
 document.getElementById("pass").type= show? "text" : "password";
}
function check(){
let p=document.getElementById("pass").value;
let fill=document.getElementById("fill"), res=document.getElementById("res"), cr=document.getElementById("crack");
let checks=[p.length>=8, /[A-Z]/.test(p), /[a-z]/.test(p), /[0-9]/.test(p), /[^A-Za-z0-9]/.test(p)];
let texts=["8+ Characters","Uppercase (A-Z)","Lowercase (a-z)","Number (0-9)","Symbol (@#$)"];
for(let i=0;i<5;i++){
 let el=document.getElementById("c"+(i+1));
 el.className= checks[i]? "item ok" : "item no";
 el.innerHTML= (checks[i]?"✅ ":"❌ ")+texts[i];
}
let score=checks.filter(Boolean).length;
fill.style.width=(score/5*100)+"%";
if(p==""){fill.style.width="0%";res.innerHTML="";cr.innerHTML="";return;}
if(score<=2){fill.style.background="#ff4444";res.innerHTML="❌ WEAK";res.style.color="#ff4444";cr.innerHTML="⏱️ Crack: Seconds"}
else if(score==3){fill.style.background="orange";res.innerHTML="⚠️ MEDIUM";res.style.color="orange";cr.innerHTML="⏱️ Crack: Days"}
else if(score==4){fill.style.background="#ffcc00";res.innerHTML="🟡 GOOD - Safe Hai";res.style.color="#ffcc00";cr.innerHTML="⏱️ Crack: Years"}
else{fill.style.background="#00e676";res.innerHTML="✅ STRONG - Uncrackable";res.style.color="#00e676";cr.innerHTML="⏱️ Crack Time: Centuries! 🔥"}
}
function generate(){
 let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!%*?&";
 let pass=""; for(let i=0;i<12;i++) pass+=chars[Math.floor(Math.random()*chars.length)];
 document.getElementById("pass").value=pass; check();
}
function copyPass(){
 let p=document.getElementById("pass"); if(!p.value) return alert("Pehle password likh!");
 p.select(); document.execCommand("copy");
 alert("Copied: "+p.value);
}
</script>
</body>
</html>
