<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deva SHIELD 20X</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#070711;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px;overflow-x:hidden}
canvas#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0}
.card{background:#151525;width:100%;max-width:410px;border-radius:20px;padding:12px;border:2px solid #ff9933;box-shadow:0 0 25px #ff993344;text-align:center;z-index:2}
.top{display:flex;gap:3px;flex-wrap:wrap;justify-content:space-between;margin-bottom:5px}
.sbtn{background:#2a2a4a;border:none;color:white;border-radius:6px;padding:4px 6px;font-size:9px;cursor:pointer}
.logo{width:50px;height:50px;background:linear-gradient(135deg,#ff9933,#138808);border-radius:10px;display:flex;justify-content:center;align-items:center;margin:4px auto;font-size:24px;font-weight:900;color:white}
h1{font-size:17px;color:white} h1 span{color:#ff9933}
.sub{font-size:7px;color:#8a8ab0;letter-spacing:1px}
.input-mini{background:#0f0f1e;border:1px solid #333;border-radius:6px;padding:5px;width:48%;color:white;font-size:10px;margin:2px 1%}
.input-wrap{position:relative;margin-top:5px}
.input-box{background:#0f0f1e;border:1.5px solid #3a3a5a;border-radius:8px;padding:9px 30px 9px 8px;width:100%;color:white;outline:none;font-size:12px}
.icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);cursor:pointer}
.bar{height:9px;background:#2a2a3e;border-radius:20px;margin:6px 0 3px;overflow:hidden}
.fill{height:100%;width:0%;transition:0.4s}
.res{font-weight:800;font-size:12px}.crack{font-size:8px;color:#aaa}
.list{text-align:left;background:#0f0f1e;border-radius:6px;padding:5px 6px;margin:3px 0}
.item{font-size:9px;margin:1px 0}.ok{color:#00e676}.no{color:#ff4444}
.ai-box{background:#1e1e3a;border:1px dashed #ff9933;border-radius:6px;padding:4px;font-size:9px;color:#ffcc66;margin:4px 0;display:none}
.breach{font-size:9px;padding:3px;border-radius:5px;margin:3px 0;display:none}
.chartBox{background:#0f0f1e;border-radius:6px;padding:4px;margin:4px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.btn{padding:7px;border-radius:7px;border:none;font-weight:700;cursor:pointer;font-size:9px}
.gen{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#111}
.copy{background:#2a2a4a;color:white}.whats{background:#25D366;color:white}
.cert{background:linear-gradient(135deg,#138808,#0d4f0d);color:white;grid-column:span 2}
.game{background:linear-gradient(135deg,#9c27b0,#673ab7);color:white}
.vault{background:linear-gradient(135deg,#2196F3,#0D47A1);color:white}
.qr{background:white;padding:4px;border-radius:6px;margin:5px auto;display:none;width:fit-content}
.hist{max-height:50px;overflow:auto;background:#0f0f1e;border-radius:5px;padding:3px;text-align:left}
.hist-item{font-size:8px;color:#888;border-bottom:1px solid #222;padding:1px 0}
#hackAlert{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.9);z-index:999;display:none;justify-content:center;align-items:center;flex-direction:column;color:white;font-weight:900;font-size:20px}
#fprint{font-size:40px;display:none;animation:fp 1s infinite}
@keyframes fp{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake 0.3s}
.footer{margin-top:5px;font-size:7px;color:#6a6a8a}
table{width:100%;font-size:8px;color:#aaa;border-collapse:collapse;margin-top:3px}
table td{border:1px solid #333;padding:2px}
</style>
</head>
<body>
<div id="hackAlert">⚠️ HACKED! WEAK! ⚠️<button onclick="this.parentElement.style.display='none'" style="margin-top:12px;padding:6px 12px;border-radius:6px;border:none">OK</button></div>
<canvas id="matrix"></canvas>
<div class="card">
<div class="top">
<button class="sbtn" onclick="toggleMode()">🌓</button><button class="sbtn" onclick="toggleSound()" id="snd">🔊</button><button class="sbtn" onclick="toggleLang()" id="lng">हिं</button><button class="sbtn" onclick="startGame()" id="gBtn">🎮</button><button class="sbtn" onclick="clearHist()">🗑️</button><button class="sbtn" onclick="toggleVault()">🔒 Vault</button>
</div>
<div class="logo">D</div>
<h1>Deva <span>SHIELD</span> 20X</h1>
<div class="sub">20 FEATURES • FINAL BOSS • CLASS 11</div>
<input id="stuName" class="input-mini" value="Deva Ram" placeholder="Naam"><input id="schName" class="input-mini" value="Govt. Sirohi" placeholder="School">
<div class="input-wrap"><input type="password" id="pass" class="input-box" placeholder="Password likho..." oninput="check()"><span class="icon" onclick="toggleEye()">👁️</span></div>
<div style="display:flex;justify-content:space-between;font-size:9px;color:#aaa;margin:4px 0"><span id="lenTxt">Length:12</span><input type="range" id="len" min="8" max="32" value="12" oninput="document.getElementById('lenTxt').innerText='Length:'+this.value" style="width:55%"></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="res" class="res"></div><div id="crack" class="crack"></div>
<div id="fprint">👆 Fingerprint Verified ✅</div>
<div id="aiBox" class="ai-box"></div><div id="breach" class="breach"></div>
<div class="list"><div id="c1" class="item no">❌ 8+ Chars</div><div id="c2" class="item no">❌ Upper</div><div id="c3" class="item no">❌ Lower</div><div id="c4" class="item no">❌ Number</div><div id="c5" class="item no">❌ Symbol</div></div>
<div class="chartBox"><canvas id="entropyChart" width="380" height="60"></canvas><table><tr><td>Laptop</td><td id="t1">-</td></tr><tr><td>SuperComputer</td><td id="t2">-</td></tr><tr><td>AI Bot</td><td id="t3">-</td></tr></table></div>
<div class="btns"><button class="btn gen" onclick="generate()">✨ Gen</button><button class="btn copy" onclick="copyPass()">📋 Copy</button><button class="btn whats" onclick="shareWA()">📱 WA</button><button class="btn game" onclick="makeQR()">🔳 QR</button><button class="btn vault" onclick="saveVault()">💾 Save Vault</button><button class="btn cert" onclick="downloadCert()">📜 Cert+Report</button></div>
<div id="qrcode" class="qr"></div><div id="hist" class="hist"></div><div class="footer">20X Features by Deva Ram | V: <span id="count">0</span> | Sirohi 307514</div>
</div>
<script>
const c=document.getElementById("matrix"),ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let drops=Array(Math.floor(c.width/14)).fill(0),mInt=null;
function drawM(){ctx.fillStyle="rgba(7,7,17,0.08)";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#ff9933";ctx.font="13px monospace";drops.forEach((y,i)=>{ctx.fillText(String.fromCharCode(33+Math.random()*94),i*14,y*14);if(y*14>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++})}
function startM(){c.style.opacity=0.45;if(!mInt)mInt=setInterval(drawM,50)}function stopM(){c.style.opacity=0;clearInterval(mInt);mInt=null}
let soundOn=true,isHindi=false,show=false,gameOn=false,scoreGame=0,gameTime=30;
let cnt=+(localStorage.getItem("deva_vis")||0)+1;localStorage.setItem("deva_vis",cnt);document.getElementById("count").innerText=cnt;
let common=["123456","password","deva","qwerty","admin","sirohi"];
const eChart=document.getElementById("entropyChart"),eCtx=eChart.getContext("2d");
function toggleMode(){document.body.classList.toggle("light")}function toggleSound(){soundOn=!soundOn;document.getElementById("snd").innerText=soundOn?"🔊":"🔇"}function toggleLang(){isHindi=!isHindi}function toggleEye(){show=!show;document.getElementById("pass").type=show?"text":"password";if(show)setTimeout(()=>{document.getElementById("pass").type="password";show=false},3000)}
function speak(t){if(!soundOn)return;let u=new SpeechSynthesisUtterance(t);u.lang='en-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}
function playType(){if(!soundOn)return;let a=new AudioContext();let o=a.createOscillator();o.frequency.value=800;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),40)}
function confetti(){for(let i=0;i<40;i++){let d=document.createElement("div");d.style.position="fixed";d.style.left=Math.random()*100+"vw";d.style.top="-10px";d.style.width="6px";d.style.height="6px";d.style.background=["#ff9933","#00e676","#ffcc00","#2196F3"][Math.floor(Math.random()*4)];d.style.zIndex=9999;document.body.appendChild(d);let anim=d.animate([{transform:"translateY(0)"},{transform:"translateY(100vh) rotate(720deg)"}],{duration:1500+Math.random()*1000});anim.onfinish=()=>d.remove()}}
function check(){
let p=document.getElementById("pass").value;if(p.length>0){startM();playType()}else stopM();
let ch=[p.length>=8,/[A-Z]/.test(p),/[a-z]/.test(p),/[0-9]/.test(p),/[^A-Za-z0-9]/.test(p)];
for(let i=0;i<5;i++){let el=document.getElementById("c"+(i+1));el.className=ch[i]?"item ok":"item no";el.innerHTML=(ch[i]?"✅ ":"❌ ")+["8+","Upper","Lower","Number","Symbol"][i]}
let s=ch.filter(Boolean).length,fill=document.getElementById("fill"),res=document.getElementById("res"),cr=document.getElementById("crack"),ai=document.getElementById("aiBox"),br=document.getElementById("breach");
fill.style.width=(s/5*100)+"%";
if(p==""){fill.style.width="0%";res.innerHTML="";cr.innerHTML="";ai.style.display="none";br.style.display="none";document.getElementById("fprint").style.display="none";drawGraph(0);return}
if(s<5){let sug=p+"@"+Math.floor(Math.random()*99)+"Raj!";ai.style.display="block";ai.innerHTML="🧠 AI: <b>"+sug+"</b> <button onclick='useAI(`"+sug+"`)' style='padding:2px 5px;background:#ff9933;border:none;border-radius:4px;color:white'>Use</button>"}else ai.style.display="none"
let isC=common.some(x=>p.toLowerCase().includes(x));br.style.display="block";if(isC){br.style.background="#ff4444";br.style.color="white";br.innerHTML="🚨 Breach! Leak list me hai!"}else{br.style.background="#00e67633";br.style.color="#00e676";br.innerHTML="✅ No Breach"}
let entropy=p.length*Math.log2(95);drawGraph(entropy);
let times=calcTimes(entropy);document.getElementById("t1").innerText=times[0];document.getElementById("t2").innerText=times[1];document.getElementById("t3").innerText=times[2];
if(s<=2){fill.style.background="#ff4444";res.innerHTML="❌ WEAK";res.style.color="#ff4444";cr.innerHTML="Seconds!";document.body.classList.add("shake");document.getElementById("hackAlert").style.display="flex";setTimeout(()=>document.body.classList.remove("shake"),300);if(navigator.vibrate)navigator.vibrate(200)}
else if(s==3){fill.style.background="orange";res.innerHTML="⚠️ MEDIUM";res.style.color="orange";cr.innerHTML="Days";document.getElementById("fprint").style.display="none"}
else if(s==4){fill.style.background="#ffcc00";res.innerHTML="🟡 GOOD";res.style.color="#ffcc00";cr.innerHTML="Years";document.getElementById("fprint").style.display="none"}
else{fill.style.background="#00e676";res.innerHTML="✅ STRONG";res.style.color="#00e676";cr.innerHTML="Centuries!";document.getElementById("fprint").style.display="block";confetti();speak("Strong password verified");if(gameOn)scoreGame++}
let h=JSON.parse(localStorage.getItem("deva_hist")||"[]");if(h[h.length-1]!==p&&p.length>2){h.push(p);if(h.length>10)h.shift();localStorage.setItem("deva_hist",JSON.stringify(h));showHist()}
}
function calcTimes(ent){let sec=Math.pow(2,ent)/1e9;let fmt=s=>s<60?Math.floor(s)+" sec":s<3600?Math.floor(s/60)+" min":s<86400?Math.floor(s/3600)+" hrs":s<31536000?Math.floor(s/86400)+" days":s<3153600000?Math.floor(s/31536000)+" years":"Centuries";return[fmt(sec),fmt(sec/1000),fmt(sec/100000)]}
function drawGraph(en){eCtx.clearRect(0,0,eChart.width,eChart.height);eCtx.fillStyle="#2a2a3e";eCtx.fillRect(0,0,eChart.width,eChart.height);let w=Math.min(en*2,eChart.width);let grad=eCtx.createLinearGradient(0,0,w,0);grad.addColorStop(0,"#ff4444");grad.addColorStop(0.5,"#ffcc00");grad.addColorStop(1,"#00e676");eCtx.fillStyle=grad;eCtx.fillRect(0,10,w,30);eCtx.fillStyle="white";eCtx.font="10px monospace";eCtx.fillText("Entropy: "+en.toFixed(1)+" bits",5,55)}
function useAI(s){document.getElementById("pass").value=s;check()}function showHist(){let h=JSON.parse(localStorage.getItem("deva_hist")||"[]");document.getElementById("hist").innerHTML=h.map(x=>"<div class='hist-item'>••••"+x.slice(-2)+" • "+new Date().toLocaleTimeString()+"</div>").reverse().join("")}showHist();
function clearHist(){localStorage.removeItem("deva_hist");document.getElementById("hist").innerHTML=""}
function generate(){let ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!%*?&";let len=document.getElementById("len").value;let p="";for(let i=0;i<len;i++)p+=ch[Math.floor(Math.random()*ch.length)];document.getElementById("pass").value=p;check()}
function copyPass(){let p=document.getElementById("pass");if(!p.value)return; p.select();document.execCommand("copy");alert("Copied!")}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent("Deva 20X Score: "+document.getElementById("pass").value+" "+location.href))}
function makeQR(){let q=document.getElementById("qrcode");q.style.display="block";q.innerHTML="";new QRCode(q,{text:location.href,width:100,height:100})}
function saveVault(){let p=document.getElementById("pass").value;if(!p)return;let pin=prompt("Vault PIN set karo (4 digit):");if(!pin)return;localStorage.setItem("vault_"+pin,btoa(p));alert("Vault me save! PIN se khulega")}
function toggleVault(){let pin=prompt("PIN daalo vault kholne:");if(!pin)return;let data=localStorage.getItem("vault_"+pin);if(!data)alert("Galat PIN!");else alert("Vault Password: "+atob(data))}
function startGame(){gameOn=true;scoreGame=0;gameTime=30;let btn=document.getElementById("gBtn");let iv=setInterval(()=>{gameTime--;btn.innerText=gameTime+"s|"+scoreGame;if(gameTime<=0){clearInterval(iv);gameOn=false;btn.innerText="🎮";alert("Score: "+scoreGame)}},1000)}
function downloadCert(){let p=document.getElementById("pass").value;if(p.length<8)return alert("Strong banao!");let name=document.getElementById("stuName").value;let sch=document.getElementById("schName").value;let w=window.open("","_blank");w.document.write(`<body style="text-align:center;font-family:sans-serif;border:12px double #ff9933;padding:20px"><h1>🏆 Deva SHIELD 20X - FINAL BOSS CERTIFICATE</h1><h2>${name} - ${sch}</h2><p>Class 11 - Sirohi - 307514</p><p style="color:green;font-weight:800">20 Features | Vault | Graph | Breach | AI | QR | Game | Fingerprint | Confetti</p><p>Password: ${"*".repeat(p.length)} - STRONG</p><p>${new Date().toLocaleString()}</p><button onclick="window.print()">Print Report</button></body>`)}
drawGraph(0);
</script>
</body>
</html>
