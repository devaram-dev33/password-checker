<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deva SHIELD - Mega</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#070711;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;transition:0.3s;overflow:hidden}
body.light{background:#fff8e1}
canvas#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0}
.card{background:#151525;width:100%;max-width:390px;border-radius:24px;padding:18px;border:2px solid #ff9933;box-shadow:0 0 25px #ff993344;text-align:center;z-index:1}
body.light.card{background:white;border-color:#ff9933}
.top{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:5px}
.sbtn{background:#2a2a4a;border:none;color:white;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}
body.light.sbtn{background:#ffe0b2;color:#111}
.logo{width:60px;height:60px;background:linear-gradient(135deg,#ff9933,#138808);border-radius:14px;display:flex;justify-content:center;align-items:center;margin:0 auto 6px;font-size:30px;font-weight:900;color:white}
h1{font-size:19px;color:white} h1 span{color:#ff9933}
.sub{color:#8a8ab0;font-size:9px;letter-spacing:1px;margin-bottom:10px}
.input-wrap{position:relative}
.input-box{background:#0f0f1e;border:1.5px solid #3a3a5a;border-radius:12px;padding:12px 40px 12px 12px;width:100%;color:white;outline:none}
.icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}
.bar{height:10px;background:#2a2a3e;border-radius:20px;margin:10px 0 6px;overflow:hidden}
.fill{height:100%;width:0%;transition:0.4s}
.res{font-weight:800;font-size:14px}
.crack{font-size:10px;color:#aaa;margin:2px 0 8px}
.list{text-align:left;background:#0f0f1e;border-radius:10px;padding:8px 10px}
.item{font-size:11px;margin:2px 0}.ok{color:#00e676}.no{color:#ff4444}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btn{padding:9px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:11px}
.gen{background:linear-gradient(135deg,#ffcc00,#ff9900);color:#111}
.copy{background:#2a2a4a;color:white}
.whats{background:#25D366;color:white}
.cert{background:linear-gradient(135deg,#138808,#1b5e20);color:white;grid-column:span 2}
.footer{margin-top:10px;font-size:9px;color:#6a6a8a}.counter{font-size:10px;color:#ff9933;margin-top:4px;font-weight:700}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="card">
<div class="top">
<button class="sbtn" onclick="toggleMode()">🌓 Mode</button>
<button class="sbtn" onclick="toggleSound()" id="snd">🔊 ON</button>
<button class="sbtn" onclick="toggleLang()" id="lng">🇮🇳 हिंदी</button>
</div>
<div class="logo">D</div>
<h1>Deva <span>SHIELD</span> 🛡️</h1>
<div class="sub" id="sub">CYBER SURAKSHA • RAJASTHAN • CLASS 11</div>
<div class="input-wrap">
<input type="password" id="pass" class="input-box" placeholder="Password likho..." oninput="check()">
<span class="icon" onclick="toggleEye()">👁️</span>
</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="res" class="res"></div>
<div id="crack" class="crack"></div>
<div class="list">
<div id="c1" class="item no">❌ 8+ Characters</div>
<div id="c2" class="item no">❌ Uppercase</div>
<div id="c3" class="item no">❌ Lowercase</div>
<div id="c4" class="item no">❌ Number</div>
<div id="c5" class="item no">❌ Symbol</div>
</div>
<div class="btns">
<button class="btn gen" onclick="generate()">✨ Generate</button>
<button class="btn copy" onclick="copyPass()">📋 Copy</button>
<button class="btn whats" onclick="shareWA()">📱 WhatsApp</button>
<button class="btn cert" onclick="downloadCert()">📜 Certificate Download</button>
</div>
<div class="counter" id="count">👁️ Visitors: 1</div>
<div class="footer">Made with ❤️ in <span style="color:#ff9933">Rajasthan</span> by Deva Ram | Sirohi 307514</div>
</div>
<script>
const c=document.getElementById("matrix"),ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
let cols=Math.floor(c.width/14),drops=Array(cols).fill(0),mInt=null;
function drawM(){ctx.fillStyle="rgba(7,7,17,0.1)";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#ff9933";ctx.font="14px monospace";drops.forEach((y,i)=>{ctx.fillText(String.fromCharCode(33+Math.random()*94),i*14,y*14);if(y*14>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++})}
function startM(){c.style.opacity=0.5;if(!mInt)mInt=setInterval(drawM,50)} function stopM(){c.style.opacity=0;clearInterval(mInt);mInt=null}
let soundOn=true,isHindi=false,show=false,lastMsg="";
let cnt=localStorage.getItem("deva_vis")||0;cnt=parseInt(cnt)+1;localStorage.setItem("deva_vis",cnt);document.getElementById("count").innerText="👁️ Visitors: "+cnt;
function toggleMode(){document.body.classList.toggle("light")} function toggleSound(){soundOn=!soundOn;document.getElementById("snd").innerText=soundOn?"🔊 ON":"🔇 OFF"}
function toggleLang(){isHindi=!isHindi;document.getElementById("lng").innerText=isHindi?"🇬🇧 English":"🇮🇳 हिंदी";document.getElementById("sub").innerText=isHindi?"साइबर सुरक्षा • राजस्थान • कक्षा 11":"CYBER SURAKSHA • RAJASTHAN • CLASS 11";document.getElementById("pass").placeholder=isHindi?"पासवर्ड लिखो...":"Password likho...";check()}
function toggleEye(){show=!show;document.getElementById("pass").type=show?"text":"password";if(show){setTimeout(()=>{document.getElementById("pass").type="password";show=false},3000)}}
function speak(t){if(!soundOn)return;let u=new SpeechSynthesisUtterance(t);u.lang=isHindi?'hi-IN':'en-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}
function check(){
let p=document.getElementById("pass").value;
let fill=document.getElementById("fill"),res=document.getElementById("res"),cr=document.getElementById("crack");
if(p.length>0)startM();else stopM();
let ch=[p.length>=8,/[A-Z]/.test(p),/[a-z]/.test(p),/[0-9]/.test(p),/[^A-Za-z0-9]/.test(p)];
let en=["8+ Characters","Uppercase (A-Z)","Lowercase (a-z)","Number (0-9)","Symbol (@#$)"];
let hi=["8+ अक्षर","बड़ा अक्षर","छोटा अक्षर","नंबर","चिन्ह"];
let txt=isHindi?hi:en;
for(let i=0;i<5;i++){let el=document.getElementById("c"+(i+1));el.className=ch[i]?"item ok":"item no";el.innerHTML=(ch[i]?"✅ ":"❌ ")+txt[i]}
let s=ch.filter(Boolean).length;fill.style.width=(s/5*100)+"%";
if(p==""){fill.style.width="0%";res.innerHTML="";cr.innerHTML="";return}
let msg="",dmsg="";
if(s<=2){fill.style.background="#ff4444";res.innerHTML=isHindi?"❌ कमजोर":"❌ WEAK";res.style.color="#ff4444";cr.innerHTML=isHindi?"⏱️ सेकंड में हैक":"⏱️ Crack: Seconds";dmsg=isHindi?"कमजोर पासवर्ड":"Weak password"}
else if(s==3){fill.style.background="orange";res.innerHTML=isHindi?"⚠️ ठीक है":"⚠️ MEDIUM";res.style.color="orange";cr.innerHTML=isHindi?"⏱️ दिनों में हैक":"⏱️ Crack: Days";dmsg=isHindi?"ठीक ठाक पासवर्ड":"Medium password"}
else if(s==4){fill.style.background="#ffcc00";res.innerHTML=isHindi?"🟡 अच्छा है":"🟡 GOOD";res.style.color="#ffcc00";cr.innerHTML=isHindi?"⏱️ सालों में हैक":"⏱️ Crack: Years";dmsg=isHindi?"अच्छा पासवर्ड":"Good password"}
else{fill.style.background="#00e676";res.innerHTML=isHindi?"✅ बहुत मजबूत":"✅ STRONG - Uncrackable";res.style.color="#00e676";cr.innerHTML=isHindi?"⏱️ सदियों में भी नहीं":"⏱️ Centuries!";dmsg=isHindi?"बहुत मजबूत पासवर्ड":"Strong unbreakable password"}
if(dmsg!==lastMsg){speak(dmsg);lastMsg=dmsg}
}
function generate(){let ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!%*?&";let p="";for(let i=0;i<12;i++)p+=ch[Math.floor(Math.random()*ch.length)];document.getElementById("pass").value=p;check();speak(isHindi?"बन गया":"Generated")}
function copyPass(){let p=document.getElementById("pass");if(!p.value)return alert(isHindi?"पहले लिखो!":"Type first!");p.select();document.execCommand("copy");speak(isHindi?"कॉपी हो गया":"Copied");alert("Copied: "+p.value)}
function shareWA(){let p=document.getElementById("pass").value||"My Password";let t=isHindi?`मेरा पासवर्ड स्कोर देखो Deva SHIELD पर: ${p} - लिंक: https://devaram-dev33.github.io/password-checker/password.html`:`Check my password score on Deva SHIELD: ${p} - https://devaram-dev33.github.io/password-checker/password.html`;window.open("https://wa.me/?text="+encodeURIComponent(t))}
function downloadCert(){let p=document.getElementById("pass").value;if(p.length<8)return alert(isHindi?"पहले मजबूत पासवर्ड बनाओ!":"Make strong password first!");let w=window.open("","_blank");w.document.write(`<html><body style="text-align:center;font-family:sans-serif;padding:20px;border:10px solid #ff9933"><h1>🏆 CYBER SURAKSHA CERTIFICATE</h1><h2>Deva SHIELD - Password Checker</h2><p>Awarded to: <b>Deva Ram - Class 11</b></p><p>Sirohi - Kochariya Kheda Basan</p><p style="color:green;font-weight:800">100% Private & Safe App - Verified Strong Password</p><p>Password: ${p.replace(/./g,"*")}</p><p>Date: ${new Date().toLocaleDateString()}</p><button onclick="window.print()">Print</button></body></html>`)}
</script>
</body>
</html>
