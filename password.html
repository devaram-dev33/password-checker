<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Password Checker</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#1a1a1a;padding:30px;border-radius:20px;border:2px solid #00ff88;width:320px;text-align:center;box-shadow:0 0 20px #00ff8844}
input{width:90%;padding:12px;margin:15px 0;border-radius:10px;border:none;font-size:16px}
button{background:#00ff88;padding:10px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.bar{width:100%;height:12px;background:#333;border-radius:10px;margin:15px 0;overflow:hidden}
.fill{height:100%;width:0%;transition:0.4s;border-radius:10px}
#result{font-weight:bold;font-size:18px}
#crack{margin-top:10px;color:#aaa;font-size:14px}
.list{text-align:left;font-size:13px;margin-top:15px;color:#ccc}
.ok{color:#00ff88} .no{color:#ff4444}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Password Checker</h2>
<input type="password" id="pass" placeholder="Password likho" oninput="check()">
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="result">Password likho...</div>
<div id="crack"></div>
<div class="list" id="list"></div>
<button onclick="toggle()" style="margin-top:15px;background:#333;color:white">👁️ Show</button>
</div>
<script>
let show=false;
function toggle(){
 show=!show;
 document.getElementById("pass").type= show ? "text" : "password";
}
function check(){
let p=document.getElementById("pass").value;
let r=document.getElementById("result"), f=document.getElementById("fill"), c=document.getElementById("crack"), l=document.getElementById("list");
let score=0;
let checks = {
 "8+ Characters": p.length>=8,
 "Uppercase (A-Z)": /[A-Z]/.test(p),
 "Lowercase (a-z)": /[a-z]/.test(p),
 "Number (0-9)": /[0-9]/.test(p),
 "Symbol (@#$)": /[^A-Za-z0-9]/.test(p)
};
let html="";
for(let k in checks){ 
 if(checks[k]){score++; html+=`<div class='ok'>✅ ${k}</div>`} 
 else{html+=`<div class='no'>❌ ${k}</div>`}
}
l.innerHTML=html;

let pct = (score/5)*100;
f.style.width=pct+"%";
if(score<=2){f.style.background="red"; r.innerHTML="❌ Weak"; r.style.color="red"; c.innerHTML="⏱️ Crack Time: Instant / Seconds"}
else if(score==3){f.style.background="orange"; r.innerHTML="⚠️ Medium"; r.style.color="orange"; c.innerHTML="⏱️ Crack Time: Hours to Days"}
else if(score==4){f.style.background="yellow"; r.innerHTML="🟡 Good"; r.style.color="yellow"; c.innerHTML="⏱️ Crack Time: Months to Years"}
else{f.style.background="#00ff88"; r.innerHTML="✅ Strong / Uncrackable"; r.style.color="#00ff88"; c.innerHTML="⏱️ Crack Time: Centuries! 🔥"}

if(p.length==0){f.style.width="0%"; r.innerHTML="Password likho..."; r.style.color="white"; c.innerHTML=""; l.innerHTML="";}
}
</script>
</body>
</html>
