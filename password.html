<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Password Checker</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1a1a1a;padding:30px;border-radius:20px;border:2px solid #00ff88;width:300px;text-align:center}
input{width:90%;padding:12px;margin:15px 0;border-radius:10px;border:none}
button{background:#00ff88;padding:10px 20px;border:none;border-radius:10px;font-weight:bold}
#result{margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Password Checker</h2>
<input type="password" id="pass" placeholder="Password likho">
<button onclick="check()">Check</button>
<div id="result"></div>
</div>
<script>
function check(){
let p=document.getElementById("pass").value;
let r=document.getElementById("result");
if(p.length<6){r.innerHTML="❌ Weak";r.style.color="red"}
else if(p.length<10){r.innerHTML="⚠️ Medium";r.style.color="yellow"}
else{r.innerHTML="✅ Strong";r.style.color="#00ff88"}
}
</script>
</body>
</html>
