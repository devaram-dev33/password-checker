1<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>DEVA • PRIVÉ LUXURY</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet"><style>body{margin:0;background:#000;color:#d4af37;font-family:Arial;text-align:center;padding:15px}h1{font-family:'Cinzel';font-size:45px;background:linear-gradient(#fff2a8,#d4af37);-webkit-background-clip:text;-webkit-text-fill-color:transparent}input{width:95%;padding:16px;font-size:20px;border:2px solid #d4af37;border-radius:12px;background:#111;color:#fff;margin:15px 0}#st{font-family:'Cinzel';font-size:20px;margin:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.card{border:1px solid #333;background:#111;border-radius:12px;padding:12px;cursor:pointer}.card.gold{border:2px solid #d4af37;box-shadow:0 0 15px #d4af3744}#pop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000e;align-items:center;justify-content:center;z-index:99}#box{background:#111;border:2px solid #d4af37;border-radius:15px;padding:20px;width:80%}</style></head><body><h1>DÉVÁ</h1><p>BASAN • PRIVATE • GOLD EDITION</p><input id="p" placeholder="ENTER CODE" oninput="chk()"><div id="st">AWAITING CODE...</div><div class="grid" id="g"></div><div id="pop" onclick="this.style.display='none'"><div id="box"><h2 id="pt" style="color:#d4af37"></h2><p id="pk"></p><p id="pf" style="color:#8f8"></p><button style="background:#d4af37;padding:10px 20px;border-radius:8px;border:none">CLOSE</button></div></div><script>const F=[["AI Shield","AI hack rok","Cyber safe"],["Cloud Backup","Online safe","Kabhi khoye nahi"],["Ad-Free","Bina ads","Disturb nahi"],["Biometric Lock","Ungli lock","Koi na khole"],["Dark Pro","Aankh aaram","Raat aaram"],["Data Encrypt","Code lock","Hacker rok"],["Offline","Bina net","Gaon me chale"],["Priority","Basan help","Top list"],["Auto Save","Auto save","Delete nahi"],["Fast Sync","Jaldi bheje","Time bache"],["VPN","Net safe","Data safe"],["Themes","Gold Black","Pasand rang"],["Analytics","Gine strong","Pata chale"],["QR Scan","QR check","Jaldi check"],["Multi Login","5 login","Time bache"],["Export PDF","PDF nikale","Teacher ko de"],["Chat Support","Chat madad","Turant jawab"],["Auto Update","Khud naya","Naya feature"],["Dark Browse","Safe browse","Galat block"],["Malware Guard","Virus bacha","Phone safe"],["Smart Backup","Akal backup","Sahi time"],["Backup Cloud","Dusri copy","Ek kharab dusra"],["Activity Log","Hisab likhe","Chori pakde"],["Privacy Lock","Jhank bacha","Koi dekhe nahi"],["Two-Factor","2 lock","Double safe"],["Session Lock","Time lock","Khula na rahe"],["Vault","Tijori safe","Strong lock"],["Spam Filter","Bekar hataye","Kachra saaf"],["Phishing Guard","Nakli bacha","Fraud bacha"],["Threat Detect","Khatra bataye","Pehle pata"],["Audit","Pura hisab","Record rakhe"],["Cleaner","Kachra saaf","Phone tez"],["Cache Clear","Cache saaf","Jagah bane"],["Storage Boost","Jagah banaye","Memory badhe"],["Focus Mode","Disturb nahi","Dhyan lage"],["Reading Mode","Aankh accha","Aankh safe"],["Night Shield","Roshni rok","Raat aaram"],["Battery Saver","Battery bacha","Charge bache"],["Boost","Phone fast","Tez chale"],["App Locker","App tala","Koi na khole"],["Incognito","Chupke check","History nahi"],["OneTap","1 click login","Jaldi login"],["Notes","Secret note","Yaad rahe"],["Cloud Sync","Sab same","Har phone same"],["History","Purana dikhe","Wapas dekhe"],["Restore","Wapas laaye","Galti sudhare"],["Secure DNS","Net safe","Hacking rok"],["Data Saver","Net kam","Net bache"],["PIN Lock","Number lock","Number safe"],["Pattern Lock","Design lock","Design safe"],["Face Unlock","Chehre khule","Chehre lock"],["Fingerprint","Anguthe lock","Anguthe lock"],["Smart Rules","Khud samjhe","Khud kaam"],["Auto Lock","Khud band","Khula na rahe"],["Recovery Key","Dusri chabi","Chabi kho dusri"],["Thar Mode","Garmi chale","Reodar 50°C"],["Tractor Mode","Khet chale","Dhul me chale"],["Sirohi Shield","Sirohi special","Sirohi baccho"],["Reodar Guard","Reodar rakshak","Reodar naam"],["Basan Tiger","Basan sher","Basan strong"],["Teacher Mode","Teacher screen","Teacher check"],["Principal Mode","Principal report","Principal sign"],["Exam Lock","Exam lock","Cheating rok"],["Screen Guard","Photo rok","Photo na le"],["Bank Lock","Bank strong","Bank safe"],["UPI Guard","UPI safe","Paise safe"],["Aadhaar Safe","Aadhaar safe","Aadhaar safe"],["OTP Auto","OTP khud","Yaad na karna"],["70X Power","70 guna tez","Sabse tez"],["Deva Gold","Rank #1","Sirohi No.1"]];const g=document.getElementById('g');F.forEach((f,i)=>{let d=document.createElement('div');d.className='card'+(i>=55?' gold':'');d.innerHTML=`<b>${i+1}. ${f[0]}</b><br><small>${f[1]}</small>`;d.onclick=()=>{pt.innerText=f[0];pk.innerText='Kaam: '+f[1];pf.innerText='Fayda: '+f[2]+' | ACTIVE';pop.style.display='flex'};g.appendChild(d)});function chk(){let v=p.value;if(!v){st.innerText='AWAITING CODE...';return}if(v.length<4){st.innerText='❌ WEAK - DENIED';st.style.color='red'}else if(v.length<8){st.innerText='⚠️ MEDIUM - LEVEL 50';st.style.color='orange'}else{st.innerText='✅ PRIVÉ GRANTED • GOLD • RANK #1';st.style.color='#d4af37'}}</script></body></html>
