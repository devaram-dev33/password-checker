const grid=document.getElementById('grid');
features.forEach((f,i)=>{
  let d=document.createElement('div');
  d.className='card'+(i>=55?' gold':'');
  d.innerHTML=`<b>${i+1}. ${f[0]}</b><br><small>${f[1]}</small>`;
  d.onclick=()=>openModal(i);
  grid.appendChild(d);
});

function openModal(i){
  document.getElementById('mTitle').innerText=(i+1)+'. '+features[i][0];
  document.getElementById('mKaam').innerText='Kaam: '+features[i][1];
  document.getElementById('mKaise').innerText='Kaise: '+features[i][2];
  document.getElementById('mFayda').innerText='Fayda: '+features[i][3]+' | Status: ACTIVE ✅';
  document.getElementById('modal').style.display='flex';
  if(navigator.vibrate) navigator.vibrate(50);
}

function checkPass(){
  let p=document.getElementById('pass').value;
  let s=document.getElementById('strength');
  if(p.length==0){s.innerText='Password Likho...';s.style.color='white';return}
  if(p.length<4){s.innerText='❌ Weak - Sirohi Rank 0';s.style.color='red'}
  else if(p.length<8){s.innerText='⚠️ Medium - Rank 50';s.style.color='orange'}
  else{s.innerText='✅ STRONG 100/100 - Sirohi Rank #1 Gold!';s.style.color='gold'}
}
