<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEVA 70 Guna - Password Vault</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;padding:14px}
h1{text-align:center;color:#d4af37;border:2px solid #d4af37;padding:10px;border-radius:14px;font-size:18px}
.vault{background:linear-gradient(180deg,#1a1605,#050500);border:1px solid gold;border-radius:16px;padding:14px;box-shadow:0 0 30px rgba(212,175,55,0.3)}
input{width:100%;padding:13px;border-radius:10px;background:#000;border:1px solid #444;color:#ffe9a0;text-align:center;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;background:linear-gradient(90deg,#d4af37,#8a6a10);border:none;border-radius:10px;font-weight:900;margin-top:10px}
.result{margin-top:10px;padding:10px;border-radius:10px;background:#0a0a0a;border:1px solid #222;font-size:13px;line-height:20px}
.str{font-size:22px;font-weight:900;text-align:center;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:14px} td{border:1px solid #222;padding:7px;font-size:11px} td:first-child{color:gold;font-weight:800;width:35px;text-align:center}
@media print{button,.vault{display:none} body{background:#fff;color:#000}}
</style></head><body>
<h1>👑 DEVA 70 GUNA VAULT<br><span style="font-size:10px;color:#888">PASSWORD SEARCH + HACK TIME + 70 FEATURES</span></h1>

<div class="vault">
<div style="color:gold;font-size:11px;letter-spacing:2px;text-align:center">🔐 PASSWORD SEARCH KARO</div>
<input id="p" type="text" placeholder="Yaha Password Likho - ex: Deva@123">
<button onclick="check()">CHECK KARO - KITNI DER ME HACK HOGA? 🔍</button>
<div id="r" class="result">Password likh ke CHECK dabao Deva...</div>
</div>

<table id="tbl"></table>
<button onclick="window.print()" style="background:#222;color:gold;border:1px solid gold">🖨️ 70 FEATURES PRINT / PDF</button>

<script>
function check(){
let v=document.getElementById('p').value;
if(!v){document.getElementById('r').innerHTML='❌ Password daal pehle!';return}
let len=v.length, hasUpper=/[A-Z]/.test(v), hasLower=/[a-z]/.test(v), hasNum=/[0-9]/.test(v), hasSym=/[^A-Za-z0-9]/.test(v);
let charset=0; if(hasLower) charset+=26; if(hasUpper) charset+=26; if(hasNum) charset+=10; if(hasSym) charset+=32;
let entropy = len * Math.log2(charset || 1);
let guesses = Math.pow(2, entropy);
let perSec = 1000000000;
let sec = guesses/perSec;
let timeText='';
if(sec<1) timeText='⚡ 1 Second se bhi kam me HACK!';
else if(sec<60) timeText=`⏱️ ${Math.floor(sec)} Second me HACK!`;
else if(sec<3600) timeText=`⏱️ ${Math.floor(sec/60)} Minute me HACK!`;
else if(sec<86400) timeText=`⏱️ ${Math.floor(sec/3600)} Ghante me HACK!`;
else if(sec<31536000) timeText=`📅 ${Math.floor(sec/86400)} Din me HACK!`;
else if(sec<3153600000) timeText=`🔒 ${Math.floor(sec/31536000)} Saal me HACK! SAFE HAI!`;
else timeText=`👑 ${Math.floor(sec/31536000)} Saal - TRILLIONAIRE SAFE! Kabhi hack nahi hoga!`;

let score=0; if(len>=8)score++; if(hasUpper)score++; if(hasNum)score++; if(hasSym)score++; if(len>=12)score++;
let level= score<=1?'❌ WEAK - Bilkul Halka': score==2?'⚠️ MEDIUM - Theek hai': score==3?'✅ STRONG - Mast hai!': score==4?'💎 VERY STRONG - Badiya!':'👑 TRILLIONAIRE LEVEL - Koi hack nahi kar payega!';

document.getElementById('r').innerHTML=`<div class=str>${level}</div><b>Password:</b> ${v}<br><b>Length:</b> ${len} Char<br><b>Upper:</b> ${hasUpper?'✅':'❌'} | <b>Number:</b> ${hasNum?'✅':'❌'} | <b>Symbol:</b> ${hasSym?'✅':'❌'}<br><b>Hack Time:</b> ${timeText}<br><b>Entropy:</b> ${entropy.toFixed(1)} bits`;
}
let f=["Trillion Dollar Vault","Liquid Gold 60fps","12,450 KG Gold Link","890 Carat Diamond GIA","1,437 Tokenized Assets","Quantum Lock","Face+Retina+Finger","Voice Unlock","AI Wealth Predictor","$500M Credit 0.5% APR","Private Jet Booking","Yacht Control Dubai","Burj Suite Access","Bugatti 3D","Rolex Tracker","NFT Vault","Crypto to Gold Swap","$1T Stock Live","Basan Pride Mode","Sirohi No.1 Badge","DNA Vault","Laser Security","Satellite Tracking","Swiss Bank Link","Dubai Gold Souk Live","Black Card Unlimited","24K Gold Keyboard","Diamond Dust Display"];
let t=document.getElementById('tbl'); let html='';
for(let i=1;i<=70;i++){ let name=f[(i-1)%f.length]+ (i>28?' - Empire v'+i:''); html+=`<tr><td>${i}</td><td>${name}</td><td style="color:#0f0">✅ ACTIVE</td></tr>`}
t.innerHTML=html;
</script>
</body></html>
