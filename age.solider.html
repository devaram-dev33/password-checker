<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devaram 10 Feature - Final Slider</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px}
.card{background:#151515;border:2px solid #00f2ff;border-radius:20px;padding:16px;max-width:430px;margin:auto}
.upload{border:2px dashed #00f2ff;display:block;text-align:center;padding:10px;border-radius:12px}
#preview{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #00f2ff;display:none;margin:10px auto}
input,button{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:none;box-sizing:border-box}
input{background:#222;color:#fff} button{background:linear-gradient(90deg,#00f2ff,#0066ff);color:#fff;font-weight:bold}
.box{background:#fff;color:#000;padding:14px;border-radius:14px;margin-top:14px;font-size:13px;line-height:1.6}
.tag{background:#000;color:#00ffcc;padding:3px 8px;border-radius:15px;font-size:11px;font-weight:bold;display:inline-block;margin:4px 0}
#mainCanvas{width:200px;height:200px;border-radius:50%;border:4px solid #ffcc00;display:block;margin:10px auto;background:#222}
input[type=range]{accent-color:#ffcc00;height:14px}
</style>
</head>
<body>
<div class="card">
<h3 style="text-align:center">🔥 Devaram Final 10 Feature</h3>
<label class="upload"><input type="file" id="photoInput" accept="image/*" hidden>📸 Yaha Photo Lagao</label>
<img id="preview">
<input type="text" id="name" value="Devaram" placeholder="Naam">
<input type="date" id="dob" value="2010-08-08">
<input type="text" id="enemy" placeholder="Dushman ka naam">
<button onclick="makeAll()">🚀 10 Feature Card Banao</button>

<div id="result" class="box" style="display:none"></div>
</div>

<script>
let photoUrl="", img=new Image(), loaded=false;
let canvas, ctx;

document.getElementById('photoInput').onchange=e=>{
 photoUrl=URL.createObjectURL(e.target.files[0]);
 document.getElementById('preview').src=photoUrl;
 document.getElementById('preview').style.display='block';
 img.onload=()=>{loaded=true; if(canvas) updateSlider(16);}
 img.src=photoUrl;
}

function drawWrinkles(age){
 if(age<28) return;
 ctx.strokeStyle=`rgba(60,40,20,${age>60?0.4:0.22})`; ctx.lineWidth=1;
 for(let i=0;i<(age-20)/2;i++){
  let x=130+Math.random()*140, y=150+Math.random()*100;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+12,y+Math.random()*3); ctx.stroke();
 }
 if(age>35){ for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(110,105+k*14); ctx.lineTo(290,103+k*14); ctx.stroke(); } }
}

function updateSlider(val){
 val=parseInt(val);
 if(!loaded) return;
 document.getElementById('ageShow').innerText=val+" Saal - "+Math.round(val)+"%";
 let gray=0, sepia=0, contrast=100, bright=100, blur=0;
 if(val<=10){ bright=112; contrast=105; }
 else if(val<=20){ contrast=110; }
 else if(val<=30){ sepia=15; contrast=115; }
 else if(val<=45){ sepia=30; gray=15; contrast=120; bright=96; }
 else if(val<=65){ gray=45; sepia=50; contrast=130; bright=90; blur=0.4; }
 else { gray=90; sepia=70; contrast=150; bright=84; blur=0.8; }
 ctx.clearRect(0,0,400,400);
 ctx.filter=`grayscale(${gray}%) sepia(${sepia}%) contrast(${contrast}%) brightness(${bright}%) blur(${blur}px)`;
 ctx.drawImage(img,0,0,400,400);
 ctx.filter='none';
 drawWrinkles(val);
 if(val>35){ ctx.fillStyle=`rgba(225,225,225,${(val-35)/70})`; ctx.beginPath(); ctx.ellipse(200,85,125,65,0,0,Math.PI*2); ctx.fill(); }
 if(val>45){ ctx.fillStyle=`rgba(230,230,230,${(val-45)/60*0.7})`; ctx.beginPath(); ctx.ellipse(200,295,85,65,0,0,Math.PI); ctx.fill(); }
}

function makeAll(){
 let dob=new Date(document.getElementById('dob').value||'2010-08-08');
 let now=new Date(); if(dob>now) dob=new Date('2010-08-08');
 let age=now.getFullYear()-dob.getFullYear();
 let days=Math.floor((now-dob)/86400000);
 let per=((age/80)*100).toFixed(1);
 let sec=Math.floor((now-dob)/1000);
 let enemy=document.getElementById('enemy').value||'Ramesh';
 let name=document.getElementById('name').value||'Devaram';
 let faceAge=Math.floor(Math.random()*2)+15;

 let html=`
<b>${name}</b> - ${age} Saal ka Full Card<br><br>

<span class="tag">1. Chehra AI 👁️</span><br>Tu ${faceAge} saal ka lagta hai, asli ${age} ka hai.<br><br>

<span class="tag">2. Awaz Wala 🎙️</span><br>Awaz bacche jaisi, umar 15 saal lag rahi.<br><br>

<span class="tag">3. Gaon Hisab 🌾</span><br>${days*3} Roti, ${age*12} Mela, ${age*100} baar neem.<br><br>

<span class="tag">4. Dushman Battle ⚔️</span><br>${name} vs ${enemy}: Tu jeet gaya!<br><br>

<span class="tag">5. Shraap/Vardan 📜</span><br>Tumhe gaon ki zimmedari di jati hai!<br><br>

<span class="tag">6. Prank Link 😈</span><br>Link banao aur dosto ko bhejo<br><br>

<span class="tag">7. Bhavishya Slider 0-100 👴 NAYA WALA</span><br>
<div style="background:#222;color:#fff;padding:10px;border-radius:12px;text-align:center;border:1px dashed #ffcc00">
<canvas id="mainCanvas" width="400" height="400"></canvas>
<div id="ageShow" style="font-size:26px;font-weight:900;color:#ffcc00">16 Saal</div>
<input type="range" id="slider" min="0" max="100" value="16" oninput="updateSlider(this.value)" style="width:100%">
<div style="height:8px;background:linear-gradient(90deg,#00f2ff,#ffcc00,#ff4400);border-radius:10px"></div>
<p style="font-size:10px">0 👉 100 kheecho, budhapa dekho</p>
</div><br>

<span class="tag">8. Sarkari Yojna 🏛️</span><br>Cycle Yojna milegi<br><br>

<span class="tag">9. Mummy Gap 👩‍👦</span><br>Mummy se ${age} saal chhota, gap 22 saal<br><br>

<span class="tag">10. Zindagi % ⏳</span><br>${per}% jee chuka, Total sec: ${sec}<br>
❤️ Heart: ${(days*100800).toLocaleString()} baar dhadka | 💍 Shaadi 26 me
`;

 document.getElementById('result').innerHTML=html;
 document.getElementById('result').style.display='block';

 // Canvas init after innerHTML
 setTimeout(()=>{
  canvas=document.getElementById('mainCanvas');
  if(canvas) ctx=canvas.getContext('2d');
  if(loaded) updateSlider(16);
 },100);
}
</script>
</body>
</html>
