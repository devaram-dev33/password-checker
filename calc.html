<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - Deva</title>
<style>
  body{font-family:Arial;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
  .calc{background:#222;padding:20px;border-radius:20px;width:280px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  #display{width:100%;height:60px;font-size:32px;text-align:right;background:#000;color:#0f0;border:none;border-radius:10px;padding:10px;box-sizing:border-box;margin-bottom:15px}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  button{height:60px;font-size:20px;border:none;border-radius:10px;background:#333;color:white;cursor:pointer}
  button:hover{background:#444}
  .equal{background:#ff9500}
  .equal:hover{background:#ffad33}
  .clear{background:#ff3b30}
</style>
</head>
<body>
<div class="calc">
  <input id="display" readonly>
  <div class="btns">
    <button class="clear" onclick="clearD()">C</button>
    <button onclick="add('/')">/</button>
    <button onclick="add('*')">*</button>
    <button onclick="del()">⌫</button>
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('-')">-</button>
    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('+')">+</button>
    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('.')">.</button>
    <button onclick="add('0')">0</button>
    <button onclick="add('00')">00</button>
    <button class="equal" onclick="calc()" style="grid-column:span 2">=</button>
  </div>
</div>
<script>
  let d=document.getElementById('display');
  function add(v){d.value+=v}
  function clearD(){d.value=''}
  function del(){d.value=d.value.slice(0,-1)}
  function calc(){try{d.value=eval(d.value)}catch{d.value='Error'}}
</script>
</body>
</html>
