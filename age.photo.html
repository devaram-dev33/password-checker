<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devaram 10 Feature - Budhapa Real Photo</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px}
.card{background:#151515;border:1px solid #00f2ff66;border-radius:18px;padding:16px;max-width:420px;margin:auto}
.upload{border:2px dashed #00f2ff;display:block;text-align:center;padding:12px;border-radius:12px}
#preview{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #00f2ff;display:none;margin:10px auto}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:none;box-sizing:border-box}
input{background:#222;color:#fff} button{background:linear-gradient(90deg,#00f2ff,#0066ff);color:#fff;font-weight:bold}
.box{background:#fff;color:#000;padding:14px;border-radius:14px;margin-top:14px;font-size:14px;line-height:1.6}
.tag{background:#000;color:#00ffcc;padding:3px 8px;border-radius:15px;font-size:11px;font-weight:bold}
.old-box{background:#222;padding:10px;border-radius:12px;text-align:center;border:1px dashed #ffcc00;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">🔥 Devaram World's First</h2>
<label class="upload"><input type="file" id="photoInput" accept="image/*" hidden>📸 Yaha Photo Lagao</label>
<img id="preview">
<input type="text" id="name" value="Devaram">
<input type="date" id="dob" value="2010-08-08">
<input type="text" id="enemy" placeholder="Dushman ka naam">
<button onclick="makeAll()">🚀 10 Feature Card Banao</button>
<div id="result" class="box" style="display:none"></div>
</div>
<script>
let photoUrl="";
document.getElementById('photoInput').onchange=e=>{
 photoUrl=URL.createObjectURL(e.target.files[0]);
 document.getElementById('preview').src=photoUrl;
 document.getElementById('preview').style.display='block';
}
function makeAll(){
 let dob=new Date(document.getElementById('dob').value);
 let now=new Date(); let age=now.getFullYear()-dob.getFullYear();
 let days=Math.floor((now-dob)/86400000);
 let per=((age/75)*100).toFixed(2);
 let sec=Math.floor((now-dob)/1000);
 let enemy=document.getElementById('enemy').value||'Ramesh';
 let faceAge=Math.floor(Math.random()*2)+15;
 let imgTag = photoUrl? `<img src="${photoUrl}" style="width:75px;height:75px;border-radius:50%;object-fit:cover;border:2px solid #00f2ff">` : "📸 Photo nahi lagayi";
 let oldImgTag = photoUrl? `<img src="${photoUrl}" style="width:75px;height:75px;border-radius:50%;object-fit:cover;border:2px solid #ffcc00;filter:grayscale(100%) sepia(80%) contrast(140%) brightness(85%) blur(0.6px)">` : "📸 Photo lagao to budhapa dikhega";

 let html=`
<b>${document.getElementById('name').value}</b> - ${age} Saal<br><br>
<span class="tag">1. Chehra AI 👁️</span><br>Tu ${faceAge} saal ka lagta hai, asli ${age} ka hai.<br><br>
<span class="tag">2. Awaz Wala 🎙️</span><br>Awaz bacche jaisi, umar 15 saal lag rahi.<br><br>
<span class="tag">3. Gaon Hisab 🌾</span><br>${days*3} Roti, ${age*12} Mela, ${age*100} baar neem.<br><br>
<span class="tag">4. Dushman Battle ⚔️</span><br>${document.getElementById('name').value} vs ${enemy}: Tu jeet gaya!<br><br>
<span class="tag">5. Shraap/Vardan 📜</span><br>Tumhe gaon ki zimmedari di jati hai!<br><br>
<span class="tag">6. Prank Link 😈</span><br>Link banao aur dosto ko bhejo<br><br>
<span class="tag">7. Bhavishya Chehra 👴 REAL</span><br>
<div class="old-box">
<div style="display:flex;justify-content:space-around;align-items:center">
<div><p style="margin:2px;font-size:11px">Abhi</p>${imgTag}</div>
<div><p style="margin:2px;font-size:11px">60 Saal Baad</p>${oldImgTag}</div>
</div>
<p style="font-size:10px;margin-top:6px">Budhapa filter: safed daadhi, jhurriya ON</p>
</div><br>
<span class="tag">8. Sarkari Yojna 🏛️</span><br>Cycle Yojna milegi<br><br>
<span class="tag">9. Mummy Gap 👩‍👦</span><br>Mummy se ${age} saal chhota, gap 22 saal<br><br>
<span class="tag">10. Zindagi % ⏳</span><br>${per}% jee chuka, Total sec: ${sec}<br><br>
❤️ Heart: ${(days*100800).toLocaleString()} baar dhadka | 💍 Shaadi 26 me
`;
 document.getElementById('result').innerHTML=html;
 document.getElementById('result').style.display='block';
}
</script>
</body>
</html>
