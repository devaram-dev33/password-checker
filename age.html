<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deva Ka 60 Feature Age Calculator - Duniya Ka Sabse Bada</title>
<style>
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:white;font-family:system-ui;padding:15px}
.box{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:20px;margin:10px 0;border:1px solid rgba(255,255,255,0.2)}
input{width:90%;padding:12px;border-radius:10px;border:none;font-size:18px;margin:10px 0}
button{padding:12px 25px;background:#ff416c;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
h2{color:#ffd700} h3{color:#00f2fe;margin:5px 0} .val{font-size:20px;font-weight:bold;color:#fff}
.small{font-size:13px;opacity:0.8}
</style>
</head>
<body>
<h1 style="text-align:center">🔥 Deva Ka 60 Feature Age Calculator 🔥</h1>
<div class="box" style="text-align:center">
<input type="date" id="dob"><br>
<input type="text" id="name" placeholder="Naam likh - ex: Deva">
<button onclick="calculate()">Calculate Karo - 60 Result Dekho</button>
</div>

<div id="result" style="display:none">
<div class="grid">
<div class="box"><h3>1-10 Basic Age</h3><div id="basic"></div></div>
<div class="box"><h3>11-18 Rashi / Zodiac</h3><div id="rashi"></div></div>
<div class="box"><h3>19-28 Desi Sarkari [VIRAL]</h3><div id="sarkari"></div></div>
<div class="box"><h3>29-36 Body + Paisa</h3><div id="body"></div></div>
<div class="box"><h3>37-44 Duniya Wala</h3><div id="duniya"></div></div>
<div class="box"><h3>45-60 AI Wale - Jo Kisi Pe Nahi</h3><div id="ai"></div></div>
</div>
<div class="box" style="text-align:center">
<button onclick="shareWA()">📱 WhatsApp Pe Share Karo</button>
<button onclick="speak()">🔊 Rajkumari Voice Me Suno</button>
</div>
</
